server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/erp_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 60000
      idle-timeout: 60000
      max-lifetime: 180000
      minimum-idle: 2
      maximum-pool-size: 10
      keepalive-time: 30000

  data:
    redis:
      host: localhost
      port: 6379

  boot:
    temp:
      location: D:/spring-temp

jwt:
  secret: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ  # 随便找个在线工具生成一个32位以上的随机字符串
  expiration: 7200000  # Token有效期（毫秒），2小时=7200000
  header: Authorization  # 前端传Token的请求头名称

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.erpsystem.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.erpsystem.mapper: debug

file:
  upload:
    expense: ${FILE_UPLOAD_EXPENSE:D:/erp/uploads/expense/} # 服务器部署时改环境变量即可
